[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmop"
dynamic = ["version"]
description = "Automated time, debris and doublet gating for flow cytometry data (FCS and Parquet)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["flow cytometry", "quality control", "gating", "FCS", "time gate", "doublets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "dask[array]",
    "readfcs",
    "flowio",
    "fcswrite",
    "fcsparser",
    "pyarrow",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
flowmop = "flowmop.cli:main"

[project.urls]
Source = "https://github.com/1ordinateur/FlowMOP"
Issues = "https://github.com/1ordinateur/FlowMOP/issues"

[tool.setuptools]
packages = ["flowmop"]

[tool.setuptools.dynamic]
version = { attr = "flowmop.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
